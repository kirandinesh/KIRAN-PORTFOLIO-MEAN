<section
  id="project"
  class="pt-20 pb-10 px-10 bg-gray-800 text-white min-h-screen bg-[radial-gradient(125%_130%_at_50%_10%,#63e_0%,#000_60%)] overflow-hidden"
>
  <div>
    <h2 class="text-4xl font-bold font-heading sm:text-5xl tracking-wider">
      Projects
    </h2>
  </div>
  <div
    class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-5 2xl:gap-10 overflow-auto"
  >
    <div
      *ngFor="let project of projects; let i = index"
      class="service-card w-full justify-between rounded-2xl shadow-xl h-full sm:p-12 md:p-5 lg:p-10 cursor-pointer snap-start shrink-0 py-8 px-6 flex flex-col items-start gap-3 transition-all duration-300 group bg-main/30 bg-clip-padding backdrop-filter backdrop-blur-sm backdrop-saturate-100 backdrop-contrast-125"
    >
      <svg
        stroke-linejoin="round"
        stroke-linecap="round"
        stroke-width="2"
        stroke="#000000"
        fill="none"
        viewBox="0 0 24 24"
        class="text-5xl h-12 w-12 stroke-gray-200"
        xmlns="http://www.w3.org/2000/svg"
      >
        <rect ry="2" rx="2" height="14" width="20" y="3" x="2"></rect>
        <line y2="21" x2="16" y1="21" x1="8"></line>
        <line y2="21" x2="12" y1="17" x1="12"></line>
      </svg>

      <p
        class="font-bold text-xl text-white sm:text-3xl md:text-xl lg:text-[1.4rem] xl:text-[1.7rem] 2xl:text-3xl"
      >
        {{ project.title }}
      </p>
      <p
        class="text-gray-400 text-sm sm:text-base md:text-[0.9rem] lg:text-lg xl:text-lg 2xl:text-xl"
      >
        {{ project.description }}
      </p>

      <div
        class="grid grid-cols-2 w-full gap-2 sm:grid-cols-3 md:grid-cols-2 lg:grid-cols-3"
      >
        <div
          *ngFor="let tech of project.techStack"
          class="w-fit flex justify-center items-center"
        >
          <span
            class="connect font-subHeading animate-shine font-bold text-base sm:text-2xl xl:text-xl md:text-base lg:text-xl 2xl:text-2xl"
            >{{ tech }}</span
          >
        </div>
      </div>

      <div class="w-full">
        <ul class="flex flex-col gap-3">
          <li
            *ngFor="let feature of project.features"
            class="text-[0.8rem] bg-black p-2 rounded-2xl border sm:text-base md:text-[0.9rem] lg:text-[1.1rem] xl:text-[1.1rem]"
          >
            {{ feature }}
          </li>
        </ul>
      </div>
      <div class="flex justify-between w-full items-center">
        <a
          href="{{ project.liveDemo }}"
          target="_blank"
          rel="noopener noreferrer"
          class="text-accent text-2xl font-extrabold animate-pulse"
          ><span class="text-white">Link --></span>
        </a>
        <p
          style="
            -webkit-text-stroke: 1px gray;
            -webkit-text-fill-color: transparent;
          "
          class="text-5xl font-bold self-end"
        >
          0{{ i + 1 }}
        </p>
      </div>
    </div>
  </div>
</section>
